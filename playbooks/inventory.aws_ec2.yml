plugin: amazon.aws.aws_ec2
regions:
  - us-east-1 
filters:
  tag:Type: managed
  instance-state-name: running
keyed_groups:
  - key: tags.Services
    prefix: ""
    separator: ""
compose:
  ansible_host: private_ip_address
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "'~/.ssh/managed_nodes.pem'"
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=no'"
